<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git 原理实验台：仓库文件 × 命令执行</title><style>
:root{--bg:#f6f7f8;--p:#fff;--line:#dfe3e8;--text:#18202a;--muted:#667085;--blue:#eef4ff;--b:#2563eb;--g:#16794b;--o:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:18px}h1{margin:0 0 6px;font-size:28px}.lead{color:var(--muted);line-height:1.6;margin-bottom:14px}.layout{display:grid;grid-template-columns:1.08fr .92fr;gap:14px}.panel{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:13px}.title{font-weight:700;margin-bottom:10px}.tools,.row,.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button,input{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px}button{cursor:pointer}button.primary{background:var(--blue);border-color:#c8d7ff}input{width:100%}.repo{display:grid;grid-template-columns:320px 1fr;gap:10px;margin-top:10px}.files{max-height:720px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fafbfc}.group{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-transform:uppercase;margin:9px 6px 5px}.f{width:100%;text-align:left;border-color:transparent;background:transparent;padding:6px 7px}.f.sel,.f.changed{background:#f2f6ff;border-color:#bfd0ff}.badge{font-size:10px;border-radius:99px;padding:2px 5px;margin-left:4px;background:#eef2f6;color:#475467}.badge.s{background:#eafaf2;color:var(--g)}.badge.m{background:#fff7e6;color:var(--o)}.viewer{display:grid;grid-template-columns:1fr 1fr;gap:9px}textarea,pre{width:100%;min-height:280px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfbfc;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:0}textarea{resize:vertical}.meta{font-size:12px;color:var(--muted);margin:5px 0 8px}.cmds{display:grid;gap:8px}.cmd{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafbfc}.cmdh{display:flex;justify-content:space-between;gap:8px;align-items:center}.cmdname{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}.args{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.args.one{grid-template-columns:1fr}.steps{display:grid;gap:7px;margin-top:10px}.step{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;cursor:pointer}.step.sel{background:#f5f8ff;border-color:#a9c2ff}.step b{font-size:13px}.small{font-size:12px;color:var(--muted);line-height:1.5}.chg{display:inline-block;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef2f6;border-radius:99px;padding:3px 6px;margin:5px 4px 0 0}@media(max-width:1050px){.layout,.repo,.viewer{grid-template-columns:1fr}.files{max-height:280px}} </style></head><body><main>
<h1>Git 原理实验台</h1><div class="lead">左边是真正的“仓库文件视角”：工作区、<code>.git/HEAD</code>、<code>.git/index</code>、refs、objects、worktrees。右边执行命令后，逐步展示每一步到底改了哪些文件，并与左边联动。</div>
<div class="layout"><section class="panel"><div class="title">仓库文件</div><div class="tools"><button class="primary" id="reset">重置</button><button id="sceneR">构造 rebase 场景</button><button id="sceneW">构造 worktree 场景</button></div><div class="repo"><div id="files" class="files"></div><div><div id="path" style="font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></div><div id="meta" class="meta"></div><div class="viewer"><div><textarea id="editor"></textarea><div class="row" style="margin-top:7px"><button id="save">保存工作区文件</button></div></div><pre id="diff">选择右侧步骤后，这里显示当前文件在该步骤中的 before → after。</pre></div></div></div></section>
<section class="panel"><div class="title">Git 命令</div><div class="cmds">
<div class="cmd"><div class="cmdh"><span class="cmdname">git status</span><button data-c="status" class="run primary">执行</button></div></div>
<div class="cmd"><div class="cmdh"><span class="cmdname">git add</span><button data-c="add" class="run">执行</button></div><div class="args one"><input id="addArg" value="."></div></div>
<div class="cmd"><div class="cmdh"><span class="cmdname">git commit</span><button data-c="commit" class="run">执行</button></div><div class="args one"><input id="msg" value="save current changes"></div></div>
<div class="cmd"><div class="cmdh"><span class="cmdname">git branch</span><button data-c="branch" class="run">执行</button></div><div class="args one"><input id="branchArg" value="feature"></div></div>
<div class="cmd"><div class="cmdh"><span class="cmdname">git checkout</span><button data-c="checkout" class="run">执行</button></div><div class="args one"><input id="checkoutArg" value="main"></div></div>
<div class="cmd"><div class="cmdh"><span class="cmdname">git reset --hard</span><button data-c="resetHard" class="run">执行</button></div><div class="args one"><input id="resetArg" value="main"></div></div>
<div class="cmd"><div class="cmdh"><span class="cmdname">git rebase</span><button data-c="rebase" class="run">执行</button></div><div class="args one"><input id="rebaseArg" value="main"></div></div>
<div class="cmd"><div class="cmdh"><span class="cmdname">git worktree add</span><button data-c="worktree" class="run">执行</button></div><div class="args"><input id="wtName" value="lab2"><input id="wtBranch" value="lab2"></div></div>
</div><div style="margin-top:12px"><div class="small">最近执行</div><div id="last" class="cmdname">尚未执行命令</div><div id="summary" class="small" style="margin-top:4px"></div><div id="steps" class="steps"></div></div></section></div>
<script>
(function(){var S,$=function(id){return document.getElementById(id)},H=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})},hash=function(x){var h=2166136261>>>0;for(var i=0;i<x.length;i++)h=Math.imul(h^x.charCodeAt(i),16777619)>>>0;return h.toString(16).padStart(8,'0')},keys=function(o){return Object.keys(o).sort()},clone=function(o){return JSON.parse(JSON.stringify(o))};
function put(t,x){var id=hash(t+'\\0'+x);if(!S.obj[id])S.obj[id]={type:t,text:x};return id}function blob(id){return S.obj[id]?S.obj[id].text:''}function head(){return S.refs[S.branch]}function snap(id){return id&&S.commits[id]?clone(S.commits[id].snap):{}}function tree(index){var x=keys(index).map(function(p){return'100644 blob '+index[p]+'\\t'+p}).join('\\n'),id=put('tree',x);S.trees[id]=clone(index);return id}function commit(msg,parent,author){var t=tree(S.index),ct='T'+(++S.clock),at=author||ct,x='tree '+t+'\\n'+(parent?'parent '+parent+'\\n':'')+'author '+at+'\\ncommitter '+ct+'\\n\\n'+msg,id=put('commit',x);S.commits[id]={id:id,tree:t,parent:parent||null,msg:msg,at:at,ct:ct,snap:clone(S.index)};S.refs[S.branch]=id;return id}
function sync(id){var s=snap(id);S.index=clone(s);S.work={};keys(s).forEach(function(p){S.work[p]=blob(s[p])})}function status(){var h=snap(head()),all={},st={staged:[],unstaged:[],untracked:[]};[h,S.index,S.work].forEach(function(o){keys(o).forEach(function(p){all[p]=1})});keys(all).forEach(function(p){var hb=h[p]||null,ib=S.index[p]||null,wb=Object.prototype.hasOwnProperty.call(S.work,p)?hash('blob\\0'+S.work[p]):null;if(!h[p]&&S.work[p]!=null&&!S.index[p])st.untracked.push(p);if(ib!==hb)st.staged.push(p);if(wb!==ib)st.unstaged.push(p)});return st}
function repo(){var r={};keys(S.work).forEach(function(p){r[p]=S.work[p]});r['.git/HEAD']='ref: refs/heads/'+S.branch+'\\n';r['.git/index']=keys(S.index).map(function(p){return p+'\\t'+S.index[p]}).join('\\n');if(S.orig)r['.git/ORIG_HEAD']=S.orig+'\\n';keys(S.refs).forEach(function(b){r['.git/refs/heads/'+b]=S.refs[b]+'\\n'});keys(S.obj).forEach(function(id){r['.git/objects/'+id.slice(0,2)+'/'+id.slice(2)]=S.obj[id].type+'\\n\\n'+S.obj[id].text});keys(S.wt).forEach(function(n){var w=S.wt[n];r['.git/worktrees/'+n+'/HEAD']='ref: refs/heads/'+w.branch+'\\n';r['worktrees/'+n+'/.git']='gitdir: ../../.git/worktrees/'+n+'\\n';keys(w.files).forEach(function(p){r['worktrees/'+n+'/'+p]=w.files[p]})});return r}
function delta(a,b){var all={},d=[];keys(a).forEach(function(p){all[p]=1});keys(b).forEach(function(p){all[p]=1});keys(all).forEach(function(p){var x=Object.prototype.hasOwnProperty.call(a,p)?a[p]:null,y=Object.prototype.hasOwnProperty.call(b,p)?b[p]:null;if(x!==y)d.push({p:p,b:x,a:y,t:x==null?'add':y==null?'del':'mod'})});return d}function start(c){S.run={cmd:c,steps:[]};S.selStep=0}function step(title,detail,fn){var a=repo();if(fn)fn();var b=repo();S.run.steps.push({title:title,detail:detail,d:delta(a,b)});S.selStep=S.run.steps.length-1}function done(x){S.summary=x||'';render()}
function addAll(){keys(S.work).forEach(function(p){S.index[p]=put('blob',S.work[p])})}
function reset(){S={clock:0,obj:{},trees:{},commits:{},refs:{},branch:'main',work:{'README.md':'# Mini Git\\n\\n教学仓库。\\n','app.js':'console.log(\"v1\");\\n'},index:{},wt:{},orig:null,run:{cmd:'初始仓库',steps:[]},summary:'',selStep:0,file:'README.md'};addAll();commit('initial commit',null);S.run.steps=[{title:'初始状态',detail:'一个 commit，工作区与 index 干净。',d:[]}];render()}
function chain(id){var a=[];while(id){a.push(id);id=S.commits[id]?S.commits[id].parent:null}return a}function base(a,b){var m={};chain(b).forEach(function(x){m[x]=1});return chain(a).find(function(x){return m[x]})||null}
function cmdStatus(){start('git status');var s=status();step('比较 HEAD / index / working tree','staged: '+(s.staged.join(', ')||'(none)')+'\\nunstaged: '+(s.unstaged.join(', ')||'(none)')+'\\nuntracked: '+(s.untracked.join(', ')||'(none)'));done('只读：status 不修改仓库文件。')}
function cmdAdd(arg){start('git add '+arg);var ps=arg==='.'?keys(S.work):(S.work[arg]!=null?[arg]:[]);step('写 blob objects','工作区内容先进入 .git/objects。',function(){ps.forEach(function(p){put('blob',S.work[p])})});step('更新 .git/index','index 变成下一次 commit 的候选快照。',function(){ps.forEach(function(p){S.index[p]=put('blob',S.work[p])})});done('add = 写 blob + 更新 index。')}
function cmdCommit(){var msg=$('msg').value||'commit';start('git commit -m "'+msg+'"');if(!status().staged.length){step('nothing to commit','index 与 HEAD 一致。');return done('没有新 commit。')}var id;step('写 tree object','把 index 物化为 tree。',function(){tree(S.index)});step('写 commit object','commit 保存 tree、parent、author/committer。',function(){id=commit(msg,head())});step('移动 branch ref','.git/refs/heads/'+S.branch+' 指向 '+id);done('commit = index → tree → commit → ref 前移。')}
function cmdBranch(){var n=$('branchArg').value.trim();start('git branch '+n);step('创建 branch ref','branch 只是 refs/heads 下的一个文件。',function(){if(n&&!S.refs[n])S.refs[n]=head()});done('不会复制工作区或 commit。')}
function cmdCheckout(){var n=$('checkoutArg').value.trim();start('git checkout '+n);if(!S.refs[n]){step('目标不存在',n);return done('checkout 失败')}step('修改 .git/HEAD','HEAD 改为 refs/heads/'+n,function(){S.branch=n});step('同步 index 与 working tree','用目标 commit 快照覆盖二者。',function(){sync(head())});done('checkout = 改 HEAD + 重写 index/working tree。')}
function cmdReset(){var n=$('resetArg').value.trim(),id=S.refs[n]||S.commits[n]&&n;start('git reset --hard '+n);if(!id){step('目标不存在',n);return done('reset 失败')}step('保存 ORIG_HEAD','记录 reset 前的位置。',function(){S.orig=head()});step('移动当前 branch ref','refs/heads/'+S.branch+' → '+id,function(){S.refs[S.branch]=id});step('覆盖 index / working tree','--hard 会把未提交修改一起覆盖。',function(){sync(id)});done('reset --hard = 移 ref + 覆盖 index/working tree。')}
function cmdRebase(){var up=$('rebaseArg').value.trim(),u=S.refs[up],old=head();start('git rebase '+up);if(!u||up===S.branch){step('参数无效','需要另一个存在的分支。');return done('rebase 未执行')}var b=base(old,u),list=[],c=old;while(c&&c!==b){list.push(c);c=S.commits[c].parent}list.reverse();step('记录 ORIG_HEAD','保存 rebase 前 HEAD。',function(){S.orig=old});if(!list.length){step('没有独有提交','无需 replay。');return done('无变化')}var np=u;list.forEach(function(oid,i){var oc=S.commits[oid],ps=snap(oc.parent),ds={},all={};keys(ps).forEach(function(p){all[p]=1});keys(oc.snap).forEach(function(p){all[p]=1});keys(all).forEach(function(p){if((ps[p]||null)!==(oc.snap[p]||null))ds[p]=oc.snap[p]||null});step('提取旧 commit '+oid,'得到相对 parent 的 patch。');step('应用到新 base','把第 '+(i+1)+' 个 patch 叠到 '+np+' 上。',function(){var ns=snap(np);keys(ds).forEach(function(p){if(ds[p]==null)delete ns[p];else ns[p]=ds[p]});S.index=clone(ns);S.work={};keys(ns).forEach(function(p){S.work[p]=blob(ns[p])})});step('创建新 commit','保留 AuthorDate，刷新 CommitterDate，并更新当前 branch ref。',function(){var prevBranch=S.branch,newid=commit(oc.msg,np,oc.at);S.refs[prevBranch]=newid;np=newid})});done('rebase = 在新 parent 上重建一串 commit。')}
function cmdWt(){var n=$('wtName').value.trim(),br=$('wtBranch').value.trim();start('git worktree add '+n+' '+br);if(!S.refs[br])step('创建 branch ref','目标分支不存在，从当前 HEAD 创建。',function(){S.refs[br]=head()});step('写 .git/worktrees 元数据','主仓库记录 linked worktree。',function(){S.wt[n]={branch:br,files:{}}});step('物化额外工作树','把分支快照展开到 worktrees/'+n+'。',function(){var s=snap(S.refs[br]),f={};keys(s).forEach(function(p){f[p]=blob(s[p])});S.wt[n].files=f});done('worktree = 共享 object DB，但有独立工作区。')}
function sceneR(){reset();start('构造 rebase 场景');step('创建 feature', '',function(){S.refs.feature=head()});step('checkout feature','',function(){S.branch='feature';sync(head())});step('feature commit','',function(){S.work['app.js']='console.log(\"feature\");\\n';addAll();commit('feature: app',head())});step('checkout main','',function(){S.branch='main';sync(head())});step('main commit','',function(){S.work['README.md']+ ='\\nmain changed.\\n';addAll();commit('main: readme',head())});step('checkout feature','现在可执行 git rebase main。',function(){S.branch='feature';sync(head())});done('rebase 场景已准备。')}
function sceneW(){reset();start('构造 worktree 场景');S.refs.docs=head();step('创建 linked worktree metadata','',function(){S.wt['docs-view']={branch:'docs',files:{}}});step('物化 docs-view','',function(){var s=snap(S.refs.docs);keys(s).forEach(function(p){S.wt['docs-view'].files[p]=blob(s[p])})});done('worktree 场景已准备。')}
function selected(){return S.run.steps[S.selStep]||null}function renderFiles(){var r=repo(),s=status(),st=selected(),chg={};if(st)st.d.forEach(function(x){chg[x.p]=x.t});var g={w:[],git:[],wt:[]};keys(r).forEach(function(p){(p.indexOf('.git/')===0?g.git:p.indexOf('worktrees/')===0?g.wt:g.w).push(p)});function list(ps){return ps.map(function(p){var badges='';if(s.staged.indexOf(p)>=0)badges+='<span class="badge s">S</span>';if(s.unstaged.indexOf(p)>=0)badges+='<span class="badge m">M</span>';if(chg[p])badges+='<span class="badge">'+chg[p]+'</span>';return'<button class="f '+(S.file===p?'sel ':'')+(chg[p]?'changed':'')+'" data-p="'+H(p)+'">'+H(p)+badges+'</button>'}).join('')}$('files').innerHTML='<div class="group">Working tree</div>'+list(g.w)+'<div class="group">.git</div>'+list(g.git)+'<div class="group">Linked worktrees</div>'+list(g.wt);document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){S.file=b.getAttribute('data-p');render()}})}
function renderView(){var r=repo(),p=S.file;if(r[p]==null)p=S.file=keys(r)[0];var editable=p&&p.indexOf('/')<0;$('path').textContent=p;$('meta').textContent=editable?'可编辑工作区文件：修改后保存，再观察 git add / commit。':'只读：Git 元数据、object 或 linked worktree 文件。';$('editor').readOnly=!editable;$('save').style.display=editable?'inline-block':'none';$('editor').value=r[p]||'';var st=selected(),hit=null;if(st)st.d.forEach(function(x){if(x.p===p)hit=x});$('diff').textContent=hit?'before\\n'+(hit.b==null?'(不存在)':hit.b)+'\\n\\n-----\\n\\nafter\\n'+(hit.a==null?'(已删除)':hit.a):(st?'当前步骤没有修改这个文件。':'选择右侧步骤后，这里显示当前文件在该步骤中的 before → after。')}
function renderSteps(){$('last').textContent=S.run.cmd;$('summary').textContent=S.summary||'';$('steps').innerHTML=S.run.steps.map(function(x,i){var cs=x.d.map(function(d){return'<span class="chg">'+d.t+': '+H(d.p)+'</span>'}).join('');return'<div class="step '+(i===S.selStep?'sel':'')+'" data-s="'+i+'"><b>'+(i+1)+'. '+H(x.title)+'</b><div class="small">'+H(x.detail||'')+'</div><div>'+cs+'</div></div>'}).join('');document.querySelectorAll('[data-s]').forEach(function(e){e.onclick=function(){S.selStep=+e.getAttribute('data-s');render()}})}
function render(){renderFiles();renderView();renderSteps()}$('save').onclick=function(){if(S.file&&S.file.indexOf('/')<0){S.work[S.file]=$('editor').value;render()}};$('reset').onclick=reset;$('sceneR').onclick=sceneR;$('sceneW').onclick=sceneW;document.querySelectorAll('.run').forEach(function(b){b.onclick=function(){var c=b.getAttribute('data-c');if(c==='status')cmdStatus();if(c==='add')cmdAdd($('addArg').value.trim());if(c==='commit')cmdCommit();if(c==='branch')cmdBranch();if(c==='checkout')cmdCheckout();if(c==='resetHard')cmdReset();if(c==='rebase')cmdRebase();if(c==='worktree')cmdWt()}});reset()})();
</script></main></body></html>
