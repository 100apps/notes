<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes · 100apps</title>
<meta name="description" content="AI 工具生成的交互材料、技术笔记、Markdown、HTML 与研究资料。">
<style>
:root{--bg:#f7f7f4;--panel:#fff;--text:#18181b;--muted:#71717a;--line:#deded8;--accent:#1d4ed8;--soft:#eef3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:980px;margin:auto;padding:56px 24px 72px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:38px}
h1{font-size:42px;line-height:1;margin:0 0 12px;letter-spacing:-1.5px}.lead{color:var(--muted);max-width:650px;line-height:1.7}
.count{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}input{width:100%;max-width:440px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;font-size:16px;margin-bottom:24px}
.list{display:grid;gap:13px}.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.card:hover{border-color:#b8b8b1}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.date,.type{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.type{background:var(--soft);color:var(--accent);border-radius:99px;padding:4px 8px}.title{font-size:21px;font-weight:700;margin-bottom:8px}.summary{color:var(--muted);line-height:1.65}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.tag{font-size:12px;border:1px solid var(--line);padding:4px 8px;border-radius:99px;color:#52525b}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;color:var(--muted)}footer{margin-top:40px;color:var(--muted);font-size:13px;line-height:1.7}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}@media(max-width:640px){main{padding:34px 15px 54px}header{display:block}h1{font-size:34px}.count{margin-top:18px}.card{padding:16px}}
</style>
</head>
<body>
<main>
<header><div><h1>Notes</h1><div class="lead">AI 工具和 Agent 生成的交互材料、技术笔记、HTML、Markdown 与研究资料。提交到 <code>main</code> 后自动发布为 GitHub Pages。</div></div><div id="count" class="count">Loading…</div></header>
<input id="q" type="search" placeholder="搜索标题、简介、标签…" aria-label="搜索资料">
<div id="list" class="list" aria-live="polite"></div>
<footer>内容索引来自 <code>entries.json</code>。发布规范见仓库根目录 <code>AGENTS.md</code>。</footer>
</main>
<script>
(async function(){
  var list=document.getElementById('list'), count=document.getElementById('count'), q=document.getElementById('q'), entries=[];
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function render(){
    var k=q.value.trim().toLowerCase();
    var items=entries.filter(function(e){return [e.title,e.summary].concat(e.tags||[]).join(' ').toLowerCase().indexOf(k)>=0;});
    count.textContent=items.length+' / '+entries.length+' entries';
    if(!items.length){list.innerHTML='<div class="empty">没有匹配的资料。</div>';return;}
    list.innerHTML=items.map(function(e){
      var tags=(e.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');
      return '<a class="card" href="'+esc(e.path)+'"><div class="top"><span class="date">'+esc(e.date)+'</span><span class="type">'+esc(e.type||'note')+'</span></div><div class="title">'+esc(e.title)+'</div><div class="summary">'+esc(e.summary)+'</div><div class="tags">'+tags+'</div></a>';
    }).join('');
  }
  try{
    var r=await fetch('./entries.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    entries=(await r.json()).sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id);});
    render();
  }catch(err){
    count.textContent='Index unavailable';
    list.innerHTML='<div class="empty">无法读取 entries.json。</div>';
  }
  q.addEventListener('input',render);
})();
</script>
</body>
</html>
